name: easytrack
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+1

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # Streams the .sqlite out of a locally-imported product-pack zip
  # (Einstellungen → Paket aus Datei laden) without holding the ~85 MB pack in
  # memory. Pure Dart, so it works on every target.
  archive: ^4.0.9
  collection: ^1.19.1
  # SHA-256 verification of downloaded product packs before they are installed.
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  # drift bundles SQLite itself from 2.32 via native assets in package:sqlite3
  # 3.x, so sqlite3_flutter_libs is deliberately absent — it is end-of-life.
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  # Picks the local product-pack zip to import. Chosen over file_picker, whose
  # Android module pins a legacy Kotlin Gradle Plugin that clashes with this
  # toolchain's built-in Kotlin; file_selector is Flutter-team maintained and
  # builds cleanly. Cross-platform (Android/iOS/desktop).
  file_selector: ^1.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  # Supplies the Material/Cupertino widget translations that MaterialApp
  # requires once a non-English locale is pinned.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  # Swipe-to-add on the meal rows. Dismissible cannot express a persistent
  # action pane that snaps back instead of removing the row.
  flutter_slidable: ^4.0.2
  http: ^1.6.0
  # Pinned by flutter_localizations from the SDK; do not raise past 0.20.2
  # without checking what the SDK ships.
  intl: ^0.20.2
  mobile_scanner: ^7.3.0
  # App version / build number for the About sheet, read at runtime so a
  # sideloaded APK reports its real build.
  package_info_plus: ^8.1.2
  path: ^1.9.1
  path_provider: ^2.1.6
  # Hands the exported App-Protokoll to the system share sheet
  # (Einstellungen → DIAGNOSE → Protokoll exportieren).
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.0
  # Opens the source-code and feedback links (Profil → MITWIRKEN) in the
  # system browser. Android 11+ also needs a <queries> entry in the manifest.
  url_launcher: ^6.3.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  # Generates the platform launcher icons from assets/icon/*.png.
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Draws the launcher-icon PNGs in tool/gen_icon.dart. Dev-only.
  image: ^4.5.4

# Launcher icons: lime tile + ascending near-black bars, matching the splash.
# Regenerate the source PNGs with `dart run tool/gen_icon.dart`, then run
# `dart run flutter_launcher_icons`.
# remove_alpha_ios strips the alpha channel: App Store icons may not have one,
# and the master PNG is fully opaque anyway (tool/gen_icon.dart fills it).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0E3B23"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Runs the ARB → AppLocalizations code generator (configured in l10n.yaml) as
  # part of the normal build, so translations live in lib/l10n/app_*.arb and are
  # editable by non-coders (and later by Weblate) without touching Dart.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Bundeslebensmittelschlüssel 4.0, built by tools/etl/build_bls.mjs.
    # Bundled rather than downloaded: it is only ~2.5 MB and it is the primary
    # search source, so the app must work fully offline the moment it installs.
    - assets/data/bls.sqlite
    # Shared with the ETL so the runtime and the index agree on compound splits.
    - tools/etl/de_food_morphemes.txt
    # The app mark, shown in the About sheet. Also the launcher-icon source.
    - assets/icon/icon.png

  # Bundled rather than fetched via google_fonts: the app must render correctly
  # on a fresh sideload with no network, and the design leans on Anton hard
  # enough that a fallback face reads as a different product.
  # Both are SIL Open Font License 1.1 — see assets/fonts/OFL.txt.
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    # A variable font: one file covering 300–700. Weights are selected with
    # TextStyle.fontVariations, not fontWeight — see core/ui/app_theme.dart.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
